name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: rustfmt
        run: cargo fmt --manifest-path crates/core/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path crates/core/Cargo.toml --release -- -D warnings

      # `[tool.uv]` builds the package without isolation, for faster rebuilds,
      # so build it once in isolation, ignoring that, to check `[build-system] requires`.
      - name: build in isolation
        run: uv build --no-config --wheel

      - name: pytest
        run: uv run pytest

      # Running the model end to end with its spreadsheets is the smoke test.
      - name: run the model
        run: uv run platform-crowd-model run --charts
