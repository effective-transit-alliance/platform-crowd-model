repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.3.1"
    hooks:
      - id: pyrefly-check
        additional_dependencies:
          ["numpy==2.5.3", "openpyxl==3.1.5", "types-openpyxl==3.1.5.20260827", "typer==0.27.2"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
