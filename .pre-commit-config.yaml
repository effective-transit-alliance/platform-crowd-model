repos:
  - repo: local
    hooks:
      # Run every tool with `uv` in the project's locked environment,
      # so the versions come from `uv.lock` rather than being pinned here, too.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
