[project]
name = "platform-crowd-model"
version = "0.1.0"
description = "Model platform crowding and alighting and boarding at NY Penn Station"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pymupdf>=1.28.2",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.scripts]
platform-crowd-model = "platform_crowd_model.cli:app"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/core/Cargo.toml"
python-source = "src"
module-name = "platform_crowd_model._core"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the Rust extension whenever its sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.lock" },
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
preset = "strict"

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
