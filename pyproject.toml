[project]
name = "platform-crowd-model"
version = "0.1.0"
description = "Model platform crowding and alighting and boarding at NY Penn Station"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pymupdf>=1.28.2",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.scripts]
platform-crowd-model = "platform_crowd_model.cli:app"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/core/Cargo.toml"
python-source = "src"
module-name = "platform_crowd_model._core"
# `uv run` installs the package editable, for local development,
# so build it with `dev`, like `cargo build` and `rust-analyzer`, to share their build;
# see `crates/core/Cargo.toml`'s profiles. Wheels build with `release`.
editable-profile = "dev"

[tool.uv]
# Build the Rust extension in the project's environment, with its locked `maturin`,
# rather than in a fresh isolated one each time,
# whose new interpreter path makes `pyo3` recompile on every rebuild (about 2.2 s).
# CI still builds a wheel in isolation, with `uv build --no-config`,
# to check that `[build-system] requires` is complete.
no-build-isolation-package = ["platform-crowd-model"]
# Rebuild the Rust extension whenever its sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.lock" },
]

[dependency-groups]
dev = [
    # For building our package without isolation; see `[tool.uv]`.
    "maturin>=1.15,<2",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
preset = "strict"

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
