[package]
name = "platform-crowd-model-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.3"
rayon = "1.12.0"

# Local development builds (`cargo build`, `rust-analyzer`, and `uv run`'s editable install)
# are optimized like `release`, since the model runs about 13x slower unoptimized,
# but incremental, so a Rust edit rebuilds faster.
# Wheels still build with `release`.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
