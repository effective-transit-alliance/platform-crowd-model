[package]
name = "platform-crowd-model-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.3"
rayon = "1.12.0"

# Local development builds (`cargo build`, `rust-analyzer`, and `uv run`'s editable install)
# are optimized like `release`, since the model runs about 13x slower unoptimized,
# but incremental, so a Rust edit rebuilds faster.
# Wheels still build with `release`.
# Without debug info, a Rust edit rebuilds about 0.1 s faster,
# and the model runs just as fast either way.
# For line numbers in panics' backtraces (with `RUST_BACKTRACE=1`) or in profilers,
# build with `CARGO_PROFILE_DEV_DEBUG=line-tables-only`.
# `uv` doesn't rebuild for a changed environment variable, so force a rebuild,
# and force another without the variable to go back:
#     CARGO_PROFILE_DEV_DEBUG=line-tables-only uv run --reinstall-package platform-crowd-model ...
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

# Always fully optimize dependencies, e.g. `pyo3` and `rayon`,
# even if our own crate's `opt-level` is lowered for faster rebuilds.
# They only rebuild when they change, so it costs nothing per edit.
[profile.dev.package."*"]
opt-level = 3
